[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spring2naut-rag"
version = "2.0.0"
description = "Local-first Spring Boot 3.x to Micronaut 4.x migration CLI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Spring2Naut-RAG Contributors" }
]
keywords = [
  "spring-boot",
  "micronaut",
  "migration",
  "rag",
  "ollama",
  "code-transformation"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Code Generators",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "langchain>=0.3.0",
  "langchain-community>=0.3.0",
  "chromadb>=0.5.0",
  "sentence-transformers>=2.7.0",
  "javalang>=0.13.0",
  "pyyaml>=6.0.1",
  "lxml>=5.3.0",
  "beautifulsoup4>=4.12.3",
  "gitpython>=3.1.41",
  "requests>=2.31.0",
  "cryptography>=41.0.0",
  "numpy>=2.0.0,<3.0.0",
  "pandas>=2.2.0",
]

[project.optional-dependencies]
dev = [
  "build>=1.2.2",
  "twine>=5.1.1",
]

[project.scripts]
spring2naut = "main:main"

[tool.setuptools]
include-package-data = false
py-modules = ["main", "migration_agent_main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.data-files]
"share/spring2naut" = [
  "migration_dataset.json.dat",
  "migration_dataset_enhanced_cleaned.json.dat",
  "README.md",
  "USER_GUIDE.md",
]
